<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Nous Admin - Zarządzanie</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            color: #4caf50;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #aaa;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4caf50;
            outline: none;
        }

        /* Wyróżnienie selecta na górze */
        #test-selector {
            background-color: #111;
            border-color: #3771c8;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #43a047;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            width: auto;
            margin-top: 0;
            padding: 10px;
            background: #333;
        }

        .btn-small:hover {
            background: #444;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>

<body>

    <!-- LOGIN PANEL -->
    <div id="login-panel" class="card" style="text-align: center;">
        <h2 style="color: #4caf50;">Nous Admin Logowanie</h2>
        <p style="color:#aaa;">Zaloguj się kontem z uprawnieniami zapisu.</p>

        <div class="form-group">
            <input type="email" id="login-email" placeholder="Email administratora">
        </div>
        <div class="form-group">
            <input type="password" id="login-pass" placeholder="Hasło">
        </div>

        <button id="btn-login">ZALOGUJ</button>
        <div id="login-status" class="status"></div>
    </div>

    <!-- ADMIN PANEL (Hidden by default) -->
    <div id="admin-panel" class="card" style="display: none;">
        <div
            style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px;">
            <h2 style="border:none; margin:0;">Zarządzanie Testami</h2>
            <button id="btn-logout" class="btn-small" style="width:auto; margin:0; background:#333;">Wyloguj</button>
        </div>

        <label>Wybierz test do edycji lub dodaj nowy:</label>
        <select id="test-selector">
            <option value="NEW">--- Dodaj Nowy Test ---</option>
            <option disabled>Ładowanie listy...</option>
        </select>

        <hr style="border: 0; border-top: 1px solid #333; margin-bottom: 20px;">

        <div class="form-group">
            <label>ID Dokumentu (Folder testu):</label>
            <input type="text" id="inp-id" placeholder="np. semafor (bez spacji!)">
        </div>

        <div class="form-group">
            <label>Nazwa wyświetlana:</label>
            <input type="text" id="inp-name" placeholder="np. Test Semafora">
        </div>

        <div class="form-group">
            <label>Opis:</label>
            <textarea id="inp-desc" rows="3" placeholder="Krótki opis, instrukcja..."></textarea>
        </div>

        <div class="form-group">
            <label>Link do ZIP (GitHub Raw):</label>
            <input type="text" id="inp-url" value="https://raw.githubusercontent.com/KaucBartosz/BBTP/refs/heads/main/"
                placeholder="https://github.com/...">
        </div>

        <div class="form-group">
            <label>Wersja:</label>
            <div class="row">
                <input type="number" id="inp-ver" value="1">
                <button class="btn-small" id="btn-bump" title="+1 Wersja">+1</button>
            </div>
        </div>

        <button id="btn-save">ZAPISZ ZMIANY / DODAJ</button>
        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import { db, auth } from './src/firebaseConfig.js';
        import { doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
        import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

        // UI refs - Login
        const loginPanel = document.getElementById('login-panel');
        const adminPanel = document.getElementById('admin-panel');
        const loginEmail = document.getElementById('login-email');
        const loginPass = document.getElementById('login-pass');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const loginStatus = document.getElementById('login-status');

        // UI refs - Admin
        const selector = document.getElementById('test-selector');
        const inpId = document.getElementById('inp-id');
        const inpName = document.getElementById('inp-name');
        const inpDesc = document.getElementById('inp-desc');
        const inpUrl = document.getElementById('inp-url');
        const inpVer = document.getElementById('inp-ver');
        const statusEl = document.getElementById('status');
        const btnSave = document.getElementById('btn-save');

        let allTestsCache = {};
        let currentUser = null;

        // --- AUTH LOGIC ---

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginPanel.style.display = 'none';
                adminPanel.style.display = 'block';
                loadTestsList();
            } else {
                currentUser = null;
                loginPanel.style.display = 'block';
                adminPanel.style.display = 'none';
            }
        });

        btnLogin.addEventListener('click', async () => {
            const email = loginEmail.value;
            const pass = loginPass.value;

            if (!email || !pass) {
                loginStatus.innerText = "Podaj email i hasło";
                loginStatus.className = "status error";
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // onAuthStateChanged will handle UI switch
            } catch (e) {
                console.error(e);
                loginStatus.innerText = "Błąd logowania: " + e.message;
                loginStatus.className = "status error";
            }
        });

        btnLogout.addEventListener('click', async () => {
            await signOut(auth);
        });

        // --- ADMIN APP LOGIC ---

        // 1. Pobieranie listy
        async function loadTestsList() {
            try {
                const snap = await getDocs(collection(db, "tests"));
                selector.innerHTML = '<option value="NEW">--- Dodaj Nowy Test ---</option>';
                allTestsCache = {};

                snap.forEach(docSnap => {
                    const t = docSnap.data();
                    const id = docSnap.id;
                    allTestsCache[id] = t;

                    const option = document.createElement('option');
                    option.value = id;
                    const name = t.name || id;
                    const ver = t.version !== undefined ? t.version : '?';
                    option.innerText = `${name} (v${ver}) [${id}]`;
                    selector.append(option);
                });
            } catch (e) {
                console.error(e);
                statusEl.innerText = "Błąd pobierania listy: " + e.message;
                statusEl.className = 'status error';
            }
        }

        // 2. Obsługa zmiany wyboru (Edit vs New)
        selector.addEventListener('change', () => {
            const val = selector.value;
            statusEl.innerText = '';
            statusEl.className = 'status';

            if (val === 'NEW') {
                // Clear form
                inpId.value = '';
                inpId.disabled = false;
                inpName.value = '';
                inpDesc.value = '';
                inpUrl.value = 'https://raw.githubusercontent.com/KaucBartosz/BBTP/refs/heads/main/';
                inpVer.value = 1;
            } else {
                // Load data
                const t = allTestsCache[val];
                if (t) {
                    inpId.value = val;
                    inpId.disabled = true; // Block ID editing
                    inpName.value = t.name || '';
                    inpDesc.value = t.description || '';
                    inpUrl.value = t.downloadUrl || '';
                    inpVer.value = t.version || 1;
                }
            }
        });

        // 3. Przycisk +1
        document.getElementById('btn-bump').addEventListener('click', () => {
            let v = parseInt(inpVer.value) || 0;
            inpVer.value = v + 1;
        });

        // 4. Zapis
        btnSave.addEventListener('click', async () => {
            if (!currentUser) return;

            const id = inpId.value.trim();
            if (!id) {
                statusEl.innerText = "Podaj ID!";
                statusEl.className = 'status error';
                return;
            }

            statusEl.innerText = "Zapisywanie...";
            statusEl.className = "status";

            const data = {
                name: inpName.value.trim(),
                description: inpDesc.value.trim(),
                downloadUrl: inpUrl.value.trim(),
                version: Number(inpVer.value),
                updatedAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, "tests", id), data, { merge: true });
                statusEl.innerText = "Zapisano pomyślnie!";
                statusEl.className = "status success";

                await loadTestsList();
                selector.value = id; // Reselect saved item
                inpId.disabled = true; // Ensure locked if was new

            } catch (e) {
                console.error(e);
                statusEl.innerText = "Błąd: " + e.message;
                statusEl.className = "status error";
            }
        });
    </script>
</body>

</html>
