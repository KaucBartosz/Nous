name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Budowanie dla Windows (korzysta z Twojego skryptu "dist")
      - name: Build Windows app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Przesłanie pliku .exe (instalator i portable)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nous-win-installer
          path: dist/*.exe
          if-no-files-found: error
