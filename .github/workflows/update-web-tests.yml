name: "Synchronizuj z BBTP i Opublikuj WebApp"

on:
  # Tylko ręczne uruchomienie (Actions -> Synchronizuj z BBTP i Opublikuj WebApp -> Run workflow).
  # Harmonogram dzienny został usunięty — testy BBTP nie zmieniają się tak często,
  # a codzienny commit bota bez zmian treści był tylko szumem w historii.
  workflow_dispatch:

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobieranie repozytorium Nous
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Przebudowywanie logiczne WebApp
        run: node build_web.js

      - name: Sprawdzanie zmian i zatwierdzanie w Repozytorium (git commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add tests-registry.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Brak nowych zmian w testach z repozytorium BBTP. Wszystko jest aktualne."
          else
            git commit -m "🤖 [Bot] Automatyczna synchronizacja i osadzenie nowych testów z repozytorium BBTP"
            git push
          fi
