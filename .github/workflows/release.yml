name: Build/Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          # macos-13 = Intel x86_64 runner — jedyny runner który:
          # 1. może zbudować universal binary (ARM64 + x64 fat binary)
          # 2. uruchamia x64 Python natywnie (potrzebne do npm ci na electron-builder)
          # macos-latest (macos-15) = Apple Silicon, nie może cross-compile x64 natywnie
          - os: macos-latest
            name: macOS Universal
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- BUILD STEPS ---

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux:ci -- --publish always

      # Universal binary = działa natywnie na Intel i Apple Silicon
      # Budujemy na Intel runnerze (macos-13) bo musi cross-compile ARM64
      - name: Build macOS Universal
        if: matrix.os == 'macos-13'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Odkomentuj gdy masz certyfikat Apple Developer:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish always
