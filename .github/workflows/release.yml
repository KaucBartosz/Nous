name: Build/Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS Universal
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 jest wymagany przez nowsze wersje Electrona i narzędzia do rebuilda modułów natywnych.
          # Użycie starszej wersji (np. 20) powoduje błędy EBADENGINE przy budowaniu na macOS.
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- WAŻNE: Używamy 'runner.os' w warunkach 'if' ---
      # Dzięki temu kroki budowania NIE zostaną pominięte, jeśli GitHub zmieni wersję 
      # obrazu pod etykietą 'macos-latest' lub 'windows-latest'.

      - name: Build Windows
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux:ci -- --publish always

      - name: Build macOS Universal
        # Warunek 'runner.os == macOS' gwarantuje uruchomienie kroku na każdym Macu (Intel/Silicon)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Odkomentuj gdy masz certyfikat Apple Developer:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish always
