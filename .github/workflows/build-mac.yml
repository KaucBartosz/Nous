name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  # Opcjonalnie: Uruchom ręcznie z zakładki Actions
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Pobranie kodu
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Konfiguracja Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalacja zależności
      - name: Install dependencies
        run: npm install

      # 4. Budowanie aplikacji (z dodanym tokenem, aby naprawić błąd)
      - name: Build macOS app
        run: npm run dist:mac -- --x64 --arm64
        env:
          # To naprawia błąd "GitHub Personal Access Token is not set"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Przesłanie pliku .dmg jako artefakt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nous-mac-installer
          path: dist/*.dmg
          if-no-files-found: error
